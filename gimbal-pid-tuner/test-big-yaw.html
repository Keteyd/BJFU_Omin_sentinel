<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Big Yaw offline browser tests</title>
<style>body{margin:0}iframe{width:100%;height:1200px;border:0}pre{white-space:pre-wrap;font:12px monospace}</style>
<pre id="result">RUNNING</pre>
<iframe id="app" src="big-yaw.html" title="Offline test app"></iframe>
<script>
'use strict';
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
const assertions = [];
function check(condition, name) {
  if (!condition) throw Error(name);
  assertions.push(name);
}
document.getElementById('app').addEventListener('load', async () => {
  try {
    const w = document.getElementById('app').contentWindow, d = w.document, P = w.BigYawProtocol;
    const $ = id => d.getElementById(id);
    const values = {angle_kp:4, speed_kp:.7, effort_limit:4, filter_tau_s:.03};
    let current = {...values}, flags = 0x93, request = 58792, status = 1, closed = false;
    let timer, controller, replyMode = 'accept', lastTune, tx = [], staged = [], stagedId = 0, stagedBefore = '', fullTimes = [], abortFails = false;
    function configFrame() {
      const payload=new Uint8Array(12), v=new DataView(payload.buffer);
      (flags&64 ? [2600,600,30000,300] : P.encoded(current)).forEach((n,i)=>v.setUint16(i*2,n,true));
      v.setUint16(8,request,true); payload[10]=status; payload[11]=flags;
      return P.frame(0x2E,payload);
    }
    function emit() {
      if (!controller || closed) return;
      controller.enqueue(configFrame());
      if(flags&64) {
        const fullFlags=status|((flags&1)?8:0)|((flags&2)?16:0)|((flags&4)?32:0)|((flags&16)?64:0)|((flags&8)?128:0);
        for(let part=0;part<4;part++) {
          const p=new Uint8Array(12),v=new DataView(p.buffer);
          v.setUint16(0,request,true);p[2]=part;p[3]=fullFlags;
          v.setFloat32(4,current[P.fields[part*2].key],true);v.setFloat32(8,current[P.fields[part*2+1].key],true);
          controller.enqueue(P.frame(0x31,p));
        }
      }
      const p=new Uint8Array(12), v=new DataView(p.buffer), t=performance.now()/300;
      [Math.sin(t)*150,Math.cos(t)*250,Math.cos(t-.3)*240,Math.sin(t)*900].forEach((n,i)=>v.setInt16(i*2,n,true));
      p[8]=1; p[9]=flags&4 ? 1:0; p[11]=1; controller.enqueue(P.frame(0x2C,p));
      const e=new Uint8Array(12), ev=new DataView(e.buffer);
      ev.setUint16(0,6816,true); ev.setUint16(2,7903,true); e[8]=3;e[10]=1;e[11]=1;
      controller.enqueue(P.frame(0x2A,e));
    }
    const port = {
      readable:new w.ReadableStream({start(c){controller=c;},cancel(){closed=true;}}),
      writable:new w.WritableStream({abort(){if(abortFails) throw Error('injected abort failure');},write(bytes){
        const f=Array.from(bytes); tx.push(f);
        if(f[1]===0x30) {
          fullTimes.push(performance.now());
          const data=Uint8Array.from(f),v=new DataView(data.buffer),part=f[4],id=v.getUint16(2,true);
          if(part===0) {staged=[];stagedId=id;stagedBefore=JSON.stringify(current);}
          if(part!==staged.length || id!==stagedId || f[5]!==0xC3) throw Error('malformed full transaction');
          staged.push([v.getFloat32(6,true),v.getFloat32(10,true)]);
          if(part!==3) {
            if(JSON.stringify(current)!==stagedBefore) throw Error('partial parameters applied');
            return;
          }
          if(replyMode==='lost') return;
          request=id;status=replyMode==='reject'?2:1;
          if(replyMode!=='reject') P.fields.forEach((field,i)=>{current[field.key]=staged.flat()[i];});
          emit();return;
        }
        if (f[1]!==0x2D) return;
        lastTune=Uint8Array.from(f);
        const v=new DataView(lastTune.buffer);
        if(replyMode==='lost') return;
        request=v.getUint16(10,true); status=replyMode==='reject'?2:1;
        if(replyMode!=='reject') P.legacyFields.forEach((field,i)=>{ current[field.key]=v.getUint16(2+i*2,true)/field.scale; });
        if(replyMode==='mismatch') current.angle_kp+=.001;
        emit();
      }}),
      async open(){ timer=setInterval(emit,100); },
      async close(){ closed=true;clearInterval(timer); }
    };
    Object.defineProperty(w.navigator,'serial',{configurable:true,value:{requestPort:async()=>port,addEventListener(){}}});
    check($('apply').disabled,'initial write disabled');
    check($('angle_kp').value==='','no invented initial gain');
    const encoded=P.tune(values,1234);
    check(JSON.stringify(Array.from(encoded))===JSON.stringify([255,45,160,15,188,2,160,15,44,1,210,4,183,1,132,13]),'wire fixture matches Python CLI');
    check(encoded[1]===0x2D && encoded[12]===0xB7 && encoded[13]===1,'big-only tune command and magic');
    check(P.decode(configFrame()).angle_kp===4,'configuration decode');
    const parser=new P.Parser();
    check(parser.push(configFrame().slice(0,7)).length===0,'fragment waits');
    check(parser.push(configFrame().slice(7)).length===1,'fragment rejoins');
    const corrupt=configFrame();corrupt[4]^=1;
    check(new P.Parser().push(corrupt).length===0,'CRC failure rejected');
    for(const value of [-1,NaN,Infinity,8.01]) {
      let refused=false;try{P.tune({...values,angle_kp:value},1);}catch(_){refused=true;}
      check(refused,`reject invalid gain ${value}`);
    }
    check(!P.safe(P.decode(configFrame()),401),'stale config cannot write');
    $('connect').click(); await wait(250);
    check($('angle_kp').value==='4','first readback initializes draft');
    check($('apply').disabled && $('writeGate').textContent.includes('未变化'),'unchanged values show exact disabled reason');
    check(tx.length>0 && tx.every(f=>f[1]===0x24 && f[2]===0xA5 && f[3]===1),'connection only sends nonlocking monitor');
    function edit(v){$('angle_kp').value=String(v);$('angle_kp').dispatchEvent(new w.Event('input'));}
    edit('');
    check($('apply').disabled && $('writeGate').textContent.includes('不能为空'),'empty field explains write lock');
    edit(8.1);
    check($('apply').disabled && $('writeGate').textContent.includes('0 至 8'),'out-of-range field explains write lock');
    edit(4.0001);
    check($('apply').disabled && $('writeGate').textContent.includes('协议精度'),'sub-protocol-resolution change explains write lock');
    edit(4.1); await wait(150);
    check(!$('apply').disabled && $('writeGate').textContent.includes('参数已变化'),'safe valid changed draft enables write');
    check($('angle_kp').value==='4.1','telemetry does not overwrite edited draft');
    check(tx.every(f=>f[1]!==0x2D),'editing never writes');
    flags=0x94;emit();await wait(120);
    check($('apply').disabled,'non-SAFE write blocked');
    check($('writeGate').textContent.includes('上置'),'non-SAFE reason names remote position');
    flags=0x95;emit();await wait(120);
    check($('apply').disabled && $('writeGate').textContent.includes('输出尚未关闭'),'active output explains write lock even with SAFE flag');
    flags=0x83;emit();await wait(120);
    check($('apply').disabled,'offline motor write blocked');
    flags=0x93;emit();await wait(120);
    $('apply').click();await wait(10);
    check($('review').open && $('confirmApply').disabled,'review requires explicit safety confirmation');
    flags=0x94;emit();await wait(120);
    $('confirmed').checked=true;$('confirmed').dispatchEvent(new w.Event('change'));
    check($('confirmApply').disabled && !$('confirmed').checked,'unsafe mode invalidates confirmation');
    $('review').close();flags=0x93;emit();await wait(120);
    async function submit() {
      $('apply').click();await wait(10);
      $('confirmed').checked=true;$('confirmed').dispatchEvent(new w.Event('change'));
      $('confirmApply').click();await wait(150);
    }
    await submit();
    check(tx.filter(f=>f[1]===0x2D).length===1,'one confirmed write');
    check($('notice').textContent.includes('已确认写入'),'matching ACK reports success');
    check(current.angle_kp===4.1 && current.speed_kp===.7,'only requested gain changed');
    check($('read_angle_kp').textContent==='4.100','verified readback displayed');
    edit(4.2);replyMode='reject';await submit();
    check($('notice').textContent.includes('拒绝') && $('apply').disabled,'firmware rejection locks writes');
    $('read').click();await wait(150);
    check($('angle_kp').value==='4.1','explicit reread restores actual values');
    edit(4.2);replyMode='mismatch';await submit();
    check($('notice').textContent.includes('不一致'),'mismatched ACK never succeeds');
    $('read').click();await wait(150);
    edit(4.3);replyMode='lost';await submit();await wait(4200);
    check($('notice').textContent.includes('超时') && $('apply').disabled,'lost ACK becomes unknown state');
    check(tx.filter(f=>f[1]===0x2D).length===4,'lost ACK never auto-retries');
    $('read').click();await wait(150);
    check($('angle_kp').value==='4.201','reread after timeout reports actual state');
    edit(4.3);clearInterval(timer);await wait(550);
    check($('apply').disabled && $('read_angle_kp').textContent==='—','telemetry timeout hides stale values and locks writes');
    timer=setInterval(emit,100);emit();await wait(150);
    $('apply').click();await wait(10); current.speed_kp=.701;emit();await wait(120);
    check($('confirmApply').disabled && $('reviewGate').textContent.includes('已变化'),'concurrent parameter change invalidates review');
    $('review').close();
    check($('export').disabled===false,'recorded data export available');
    $('pause').click();await wait(120);check($('pause').title==='继续曲线','pause control toggles');
    $('pause').click();
    const canvas=$('errorChart'), pixels=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;
    let colored=0; for(let i=0;i<pixels.length;i+=4) if(pixels[i]>120 && pixels[i]>pixels[i+1]*1.3 && pixels[i+3]>0) colored++;
    check(colored>0,'telemetry trace has nonblank colored pixels');
    check(d.documentElement.scrollWidth<=w.innerWidth,'no horizontal page overflow');
    $('read').click();await wait(150);
    function editEffort(value) {
      $('effort_limit').value=String(value);$('effort_limit').dispatchEvent(new w.Event('input'));
    }
    check($('effort_limit').max==='8','legacy firmware retains advertised effort range');
    editEffort(12);
    check($('apply').disabled && $('writeGate').textContent.includes('需要烧录'),'legacy firmware blocks effort above 8 with upgrade reason');
    const writesBefore=tx.filter(f=>f[1]===0x2D).length;
    flags=0xB3;emit();await wait(120);
    check($('effort_limit').max==='30' && !$('apply').disabled,'new firmware advertises full-scale range without auto-writing');
    check(tx.filter(f=>f[1]===0x2D).length===writesBefore,'capability update does not send a parameter');
    replyMode='accept';await submit();
    check(current.effort_limit===12 && $('notice').textContent.includes('已确认写入'),'extended effort write requires matching ACK');
    editEffort(30.001);
    check($('apply').disabled,'effort above protocol full scale is refused');
    editEffort(30);await submit();
    check(current.effort_limit===30 && $('read_effort_limit').textContent==='30.000','full-scale 30000-unit command round trips');
    for(const effort of [-30000,30000]) {
      const data=new Uint8Array(12); new DataView(data.buffer).setInt16(6,effort,true);data[11]=1;
      check(P.decode(P.frame(0x2C,data)).effort===effort/1000,'signed full-scale telemetry does not overflow '+effort);
    }
    check($('angle_ki').disabled && $('speed_kd').disabled,'I/D unavailable on legacy firmware');
    current={...current,angle_ki:0,angle_kd:0,speed_ki:0,speed_kd:0};flags=0xF3;emit();await wait(150);
    check(!$('angle_ki').disabled && !$('speed_kd').disabled,'complete firmware enables both loops I/D');
    check(['angle_kp','angle_ki','angle_kd','speed_kp','speed_ki','speed_kd','filter_tau_s'].every(id=>!$(id).hasAttribute('max')),'full PID fields have no arbitrary upper limit');
    const fullDraft={angle_kp:10000,speed_kp:20000,effort_limit:30,filter_tau_s:.5,angle_ki:.01,angle_kd:.1,speed_ki:.02,speed_kd:.2};
    for(const [key,value] of Object.entries(fullDraft)) {$(key).value=value;$(key).dispatchEvent(new w.Event('input'));}
    check(!$('apply').disabled,'gains above former fixed-point range accepted on full firmware');
    const n=tx.length;await submit();
    check(tx.slice(n).filter(f=>f[1]===0x30).length===4,'one ordered four-frame transaction sends all eight floats');
    check(fullTimes.length===4 && fullTimes.slice(1).every((t,i)=>t-fullTimes[i]>=19),'full write leaves IDLE gaps between frames');
    check(P.fullValues(current).every((v,i)=>v===P.fullValues(fullDraft)[i]),'all six gains and output/filter verified together');
    check($('notice').textContent.includes('已确认写入'),'complete float readback confirms atomic write');
    for(const bad of [Infinity,NaN,1e40,1e-50,-1]) {
      let rejected=false;try{P.fullValues({...fullDraft,angle_ki:bad});}catch(_){rejected=true;}
      check(rejected,'invalid or unrepresentable float rejected '+bad);
    }
    const before=tx.length; abortFails=true;
    controller.error(new w.DOMException('injected device loss','NetworkError'));await wait(300);
    check($('notice').textContent.includes('NetworkError') && $('events').textContent.includes('injected abort failure'),'read error details retained and failing abort is isolated');
    check(closed && $('apply').disabled,'disconnect releases port and locks writes');
    check(tx.length===before,'disconnect sends no stop, enable or parameter command');
    check(tx.every(f=>[0x24,0x2D,0x30].includes(f[1])),'no small-yaw, Pitch or motion command emitted');
    const golden=Array.from(encoded);
    document.getElementById('result').textContent=JSON.stringify({ok:true,count:assertions.length,assertions,golden});
  } catch(e) {
    document.getElementById('result').textContent=JSON.stringify({ok:false,error:e.stack,assertions});
  }
});
</script>
</html>
